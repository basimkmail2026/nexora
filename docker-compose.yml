services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nexora
      POSTGRES_USER: nexora
      POSTGRES_PASSWORD: nexora_dev
    ports: ["5432:5432"]
    volumes: [nexora_db:/var/lib/postgresql/data]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  app:
    build: .
    depends_on: [db, redis]
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: postgresql://nexora:nexora_dev@db:5432/nexora
      REDIS_URL: redis://redis:6379
      JWT_SECRET: change-this-secret-in-production-123456
      ENCRYPTION_KEY: change-this-encryption-key-123456
      APP_URL: http://localhost:4000
      CORS_ORIGIN: http://localhost:4000
    ports: ["4000:4000"]

volumes:
  nexora_db:
